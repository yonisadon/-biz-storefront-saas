name: Tenant contact-flow migration smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/tenant-014-waitlist-crm-link.sql'
      - 'backend/migrations/tenant-015-contact-options.sql'
      - 'backend/migrations/tenant-016-retire-service-booking-trigger.sql'
      - 'backend/migrations/tenant-017-decouple-appointment-crm-link.sql'
      - 'backend/tests/fixtures/tenant-contact-flow-prerequisites.sql'
      - 'backend/tests/fixtures/tenant-contact-flow-assertions.sql'
      - '.github/workflows/tenant-contact-flow-migration.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: btime_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btime_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable tenant prerequisites
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/tenant-contact-flow-prerequisites.sql
      - name: Apply contact-flow migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in \
            backend/migrations/tenant-014-waitlist-crm-link.sql \
            backend/migrations/tenant-015-contact-options.sql \
            backend/migrations/tenant-016-retire-service-booking-trigger.sql \
            backend/migrations/tenant-017-decouple-appointment-crm-link.sql; do
            psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Re-run contact-flow migrations to verify idempotence
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in \
            backend/migrations/tenant-014-waitlist-crm-link.sql \
            backend/migrations/tenant-015-contact-options.sql \
            backend/migrations/tenant-016-retire-service-booking-trigger.sql \
            backend/migrations/tenant-017-decouple-appointment-crm-link.sql; do
            psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify contact migration and independent record lifecycles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/tenant-contact-flow-assertions.sql
