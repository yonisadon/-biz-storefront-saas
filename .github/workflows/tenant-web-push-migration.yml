name: Tenant Web Push migration smoke test

on:
  pull_request:
    branches: [main, feat/service-product-contact-flows]
    paths:
      - 'backend/migrations/tenant-013-web-push.sql'
      - 'backend/migrations/tenant-018-customer-device-push-consent.sql'
      - 'backend/migrations/tenant-schema.sql'
      - 'backend/tests/fixtures/tenant-push-prerequisites.sql'
      - 'backend/tests/fixtures/tenant-push-assertions.sql'
      - '.github/workflows/tenant-web-push-migration.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: btime_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btime_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable tenant prerequisites
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/tenant-push-prerequisites.sql
      - name: Apply tenant Push migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/migrations/tenant-013-web-push.sql
      - name: Re-run tenant Push migration to verify idempotence
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/migrations/tenant-013-web-push.sql
      - name: Apply customer device consent migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/migrations/tenant-018-customer-device-push-consent.sql
      - name: Re-run customer device consent migration to verify idempotence
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/migrations/tenant-018-customer-device-push-consent.sql
      - name: Verify tenant isolation, defaults, and indexes
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_tenant_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/tenant-push-assertions.sql
