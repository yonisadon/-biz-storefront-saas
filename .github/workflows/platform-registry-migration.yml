name: Platform registry migration smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/000_tenant_registry.sql'
      - 'backend/migrations/001_platform_accounts_subscriptions.sql'
      - 'backend/migrations/002_platform_content_and_messages.sql'
      - 'backend/migrations/003_platform_retention_policies.sql'
      - 'backend/migrations/004_management_access_and_encrypted_tokens.sql'
      - 'backend/migrations/005_seller_onboarding_state.sql'
      - 'backend/migrations/tenant-012-configurable-retention.sql'
      - 'backend/tests/fixtures/platform-registry-prerequisites.sql'
      - 'backend/tests/fixtures/platform-registry-assertions.sql'
      - 'backend/integration-tests/**'
      - 'backend/src/routes/auth.ts'
      - 'backend/src/routes/admin.ts'
      - 'backend/src/provisioning.ts'
      - 'backend/src/server.ts'
      - 'backend/package.json'
      - 'backend/scripts/migrate-platform-registry.ts'
      - 'backend/src/platformRegistryMigrationPolicy.ts'
      - 'backend/tests/platformRegistryMigrationPolicy.test.ts'
      - 'backend/tsconfig.json'
      - '.github/workflows/platform-registry-migrations.yml'
      - 'database-migrations/README.md'
      - 'SYSTEM_SPEC.md'
      - '.github/workflows/platform-registry-migration.yml'

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: btime_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btime_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable registry prerequisites
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/platform-registry-prerequisites.sql
      - name: Apply tenant registry migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/000_tenant_registry.sql
      - name: Apply platform accounts migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/001_platform_accounts_subscriptions.sql
      - name: Apply platform content and messages migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/002_platform_content_and_messages.sql
      - name: Apply configurable retention policies migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/003_platform_retention_policies.sql
      - name: Re-run platform retention migration to verify idempotence
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/003_platform_retention_policies.sql
      - name: Apply permanent management access migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/004_management_access_and_encrypted_tokens.sql
      - name: Re-run permanent management access migration to verify idempotence
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/004_management_access_and_encrypted_tokens.sql
      - name: Apply seller onboarding state migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/005_seller_onboarding_state.sql
      - name: Create a new unfinished business before migration rerun
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -c "INSERT INTO public.businesses (id, slug, name) VALUES ('00000000-0000-0000-0000-000000000002', 'migration-smoke-new', 'Migration Smoke New')"
      - name: Re-run seller onboarding state migration to verify idempotence
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/migrations/005_seller_onboarding_state.sql
      - name: Verify access rules and admin-originated deletion requests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d btime_registry_test -v ON_ERROR_STOP=1 -f backend/tests/fixtures/platform-registry-assertions.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Exercise account registration, verification, sessions, password reset and consent API
        working-directory: backend
        env:
          APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/btime_registry_test
          SUPERADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/btime_registry_test
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/btime_registry_test
          MEDIA_BASE_URL: http://localhost:3000
          PUBLIC_BASE_URL: http://localhost:3000
          BREVO_API_KEY: integration-test-key
          EMAIL_FROM: BTime Tests <noreply@example.test>
          DATABASE_SSL: 'false'
          NODE_ENV: test
          MANAGEMENT_TOKEN_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: npm run test:platform-integration
