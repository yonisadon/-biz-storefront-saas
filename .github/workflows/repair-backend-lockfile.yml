name: Repair backend lockfile

on:
  push:
    branches:
      - fix/railway-backend-lockfile
    paths-ignore:
      - backend/package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/railway-backend-lockfile
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate backend package lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "fix: synchronize backend npm lockfile"
          git push origin HEAD:fix/railway-backend-lockfile
