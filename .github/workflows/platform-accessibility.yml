name: Platform account accessibility smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/app/layout.tsx'
      - 'web/app/globals.css'
      - 'web/app/register/**'
      - 'web/app/login/**'
      - 'web/app/account/**'
      - 'web/app/forgot-password/**'
      - 'web/app/reset-password/**'
      - 'web/app/verify-email/**'
      - 'web/app/platform-admin/**'
      - 'web/app/platform-legal/**'
      - 'web/components/Account*.tsx'
      - 'web/components/GlobalAccessibilityToolbar.tsx'
      - 'web/integration-tests/**'
      - '.github/workflows/platform-accessibility.yml'

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser accessibility test tools
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Build web application
        working-directory: web
        run: npm run build
      - name: Start web application
        working-directory: web
        run: |
          npm start > /tmp/btime-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/btime-web.log
          exit 1
      - name: Scan account and platform pages with axe
        working-directory: web
        run: node integration-tests/accessibility.cjs
