name: Tenant schema migrations

on:
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/src/tenantMigrations.ts'
      - 'backend/scripts/migrate-tenant-schemas.ts'
      - '.github/workflows/tenant-schema-migrations.yml'
  workflow_dispatch:
    inputs:
      proceed_without_backup:
        description: 'Explicitly authorize tenant migrations without a verified restorable backup'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tenant-schema-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending tenant migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      SUPERADMIN_DATABASE_URL: ${{ secrets.SUPERADMIN_DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      TENANT_MIGRATION_BACKUP_CONFIRMED: ${{ secrets.TENANT_MIGRATION_BACKUP_CONFIRMED }}
      PROCEED_WITHOUT_BACKUP: ${{ inputs.proceed_without_backup }}
    steps:
      # Checkout must run before any step using the job's backend working-directory.
      - uses: actions/checkout@v4

      - name: Validate required secrets and backup authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_ADMIN_URL" || -z "$SUPERADMIN_DATABASE_URL" ]]; then
            echo "::error::Configure DATABASE_ADMIN_URL and SUPERADMIN_DATABASE_URL in GitHub Actions secrets."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PROCEED_WITHOUT_BACKUP" == "true" ]]; then
            echo "::warning::Proceeding with ALL pending tenant migrations without a verified restorable backup, explicitly authorized for this manual run only."
          elif [[ "$TENANT_MIGRATION_BACKUP_CONFIRMED" != "true" ]]; then
            echo "::error::A verified restorable backup is required. For a one-time manual exception, dispatch this workflow with proceed_without_backup=true."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Preflight and apply pending migrations
        run: npm run migrate-tenant-schemas:deploy
