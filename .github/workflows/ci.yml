name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # The current picomatch advisory affects the ESLint-only development toolchain and has no published fixed version.
      # Keep the full audit visible as a warning, while enforcing a clean production dependency audit.
      - run: npm audit --audit-level=moderate || echo "::warning::Full web dependency audit reports a development-toolchain advisory; see GHSA-fc5q-39xc-vjpf."
        working-directory: web
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
