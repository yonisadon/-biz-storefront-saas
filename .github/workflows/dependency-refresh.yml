name: Refresh dependency lockfiles

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfiles from patched package manifests
        run: |
          cd web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ../backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Report npm audit findings
        run: |
          (cd web && npm audit --json > /tmp/web-audit.json || true)
          (cd backend && npm audit --json > /tmp/backend-audit.json || true)
          node <<'NODE'
          const fs = require('node:fs');
          for (const [name, path] of [['web', '/tmp/web-audit.json'], ['backend', '/tmp/backend-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(name + ' audit:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [pkg, finding] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(name + ' package:', pkg, 'severity:', finding.severity, 'direct:', finding.isDirect, 'fixAvailable:', JSON.stringify(finding.fixAvailable));
            }
          }
          NODE

      - name: Install and validate Web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Install and validate Backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package manifests."
            exit 0
          fi
          git commit -m "chore: refresh npm lockfiles"
          git push
